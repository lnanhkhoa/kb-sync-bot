[project]
name = "optibot"
version = "0.1.0"
description = "Scrape the OptiSigns help center into clean Markdown for an AI assistant knowledge base."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "google-genai>=3.6.1",
    "markdownify>=1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
